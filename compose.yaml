services:
  home-energy:
    build: .
    container_name: home-energy
    restart: unless-stopped
    ports:
      - "${ENERGY_BIND_ADDRESS:?Set this in .env}:8088:8000"
    environment:
      ENERGY_DATA_DIR: /app/data
      ENERGY_INITIAL_PASSWORD: ${ENERGY_INITIAL_PASSWORD:?Set this in .env before first start}
      ENERGY_SESSION_SECRET: ${ENERGY_SESSION_SECRET:?Set this in .env}
      ENERGY_LENNOX_HOST: ${ENERGY_LENNOX_HOST:-}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
