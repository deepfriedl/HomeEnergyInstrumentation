{% extends 'base.html' %}{% block content %}<div class="title-row"><div><p class="eyebrow">DEVICE</p><h1>{{device.name}}</h1><p class="muted">{{device.ip_address}}</p></div><a class="button" href="/?range={{range}}">Back to overview</a></div><p class="ranges">{% for key in ranges %}<a href="/devices/{{device.id}}?range={{key}}">{{key}}</a>{% endfor %}</p><section class="panel"><h2>Power · {{range}}</h2><canvas id="device-chart"></canvas></section><script>const readings={{series|tojson}};</script><script src="/static/chart.js"></script><script>drawChart(document.getElementById('device-chart'),readings,'watts','{{device.color}}');</script>{% endblock %}
