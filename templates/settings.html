{% extends 'base.html' %}{% block content %}<div class="title-row"><div><p class="eyebrow">SETTINGS</p><h1>Monitored plugs</h1></div></div><section class="panel"><h2>Add device</h2><form class="settings-form" method="post" action="/settings/device"><label>Name<input name="name" required placeholder="Device name"></label><label>IP address<input name="ip_address" required placeholder="192.168.x.x"></label><label>Chart color<input name="color" type="color" value="#64d8cb"></label><label class="check"><input name="enabled" type="checkbox" checked> Collect readings</label><button class="primary">Add device</button></form></section><section class="panel"><h2>Configured devices</h2>{% for d in devices %}<form class="settings-form edit" method="post" action="/settings/device/{{d.id}}"><label>Name<input name="name" value="{{d.name}}" required></label><label>IP address<input name="ip_address" value="{{d.ip_address}}" required></label><label>Chart color<input name="color" type="color" value="{{d.color}}"></label><label class="check"><input name="enabled" type="checkbox" {% if d.enabled %}checked{% endif %}> Collect readings</label><button>Save</button></form><form class="remove-form" method="post" action="/settings/device/{{d.id}}/delete"><button class="danger">Remove {{d.name}}</button></form>{% else %}<p class="empty">No devices configured.</p>{% endfor %}</section>{% endblock %}
